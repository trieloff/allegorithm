<head>
<meta charset="utf-8">

<title>Nacre Playground</title>
<style>
  :root { --bg:#101418; --panel:#171d24; --ink:#d8dee6; --dim:#7b8794; --accent:#5fb3b3; --edge:#232b34; }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 15px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace; min-height: 100vh; padding: 1.25rem; }
  header { display: flex; align-items: baseline; gap: 1rem; margin-bottom: 1rem; flex-wrap: wrap; }
  h1 { font-size: 1.2rem; letter-spacing: .12em; }
  h1 .pearl { color: var(--accent); }
  header p { color: var(--dim); font-size: .8rem; }
  .bar { display: flex; gap: .6rem; margin-bottom: 1rem; align-items: center; flex-wrap: wrap; }
  select, button { background: var(--panel); color: var(--ink); border: 1px solid var(--edge); border-radius: 6px; padding: .45rem .8rem; font: inherit; font-size: .85rem; }
  button { cursor: pointer; border-color: var(--accent); color: var(--accent); }
  button:hover { background: var(--accent); color: var(--bg); }
  .status { color: var(--dim); font-size: .8rem; }
  .panes { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: .8rem; min-height: 70vh; }
  @media (max-width: 960px) { .panes { grid-template-columns: 1fr; } }
  .pane { display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--edge); border-radius: 8px; overflow: hidden; }
  .pane h2 { font-size: .7rem; letter-spacing: .15em; color: var(--dim); padding: .5rem .8rem; border-bottom: 1px solid var(--edge); font-weight: normal; text-transform: uppercase; }
  textarea, pre { flex: 1; background: none; color: inherit; border: 0; padding: .8rem; font: inherit; font-size: .78rem; overflow: auto; white-space: pre; resize: none; outline: none; }
  #canvas { margin: .8rem; image-rendering: pixelated; max-width: calc(100% - 1.6rem); border-radius: 4px; }
</style>

const EXAMPLES = {
  "fizzbuzz": ";; FizzBuzz. The macros are the argument; the machine is the proof.\n;;\n;;   npx tsx src/nacre/cli.ts examples/fizzbuzz.nacre > /tmp/fizzbuzz.wat\n;;   wasmtime /tmp/fizzbuzz.wat\n;;\n;; Memory: iovec at 0, digit buffer below 24, nwritten at 24.\n;; Nacre pools inline strings into data segments from 32 up.\n\n(module\n  (import \"wasi_snapshot_preview1\" \"fd_write\"\n    (func $fd_write (param i32 i32 i32 i32) (result i32)))\n  (memory (export \"memory\") 1)\n\n  (func $print (param $ptr i32) (param $len i32)\n    (i32.store (i32.const 0) (local.get $ptr))\n    (i32.store (i32.const 4) (local.get $len))\n    (drop (call $fd_write (i32.const 1) (i32.const 0) (i32.const 1) (i32.const 24))))\n\n  (func $printnum (param $n i32)\n    (local $p i32)\n    (local.set $p (i32.const 24))\n    (loop $digit\n      (local.set $p (i32.sub (local.get $p) (i32.const 1)))\n      (i32.store8 (local.get $p)\n        (i32.add (i32.const 48) (i32.rem_u (local.get $n) (i32.const 10))))\n      (local.set $n (i32.div_u (local.get $n) (i32.const 10)))\n      (br_if $digit (local.get $n)))\n    (call $print (local.get $p) (i32.sub (i32.const 24) (local.get $p))))\n\n  (defmacro $divisible? (n d)\n    `(i32.eqz (i32.rem_u ,n ,d)))\n\n  (defmacro $when (test body)\n    `(if ,test (then ,body)))\n\n  (defmacro $print-if (test str)\n    `($when ,test (call $print ,str)))\n\n  (defmacro $and (a b)\n    `(i32.and (i32.ne ,a (i32.const 0)) (i32.ne ,b (i32.const 0))))\n\n  (defmacro $for (init test step body)\n    `(splice\n       ,init\n       (block $break\n         (loop $continue\n           (br_if $break (i32.eqz ,test))\n           ,body\n           ,step\n           (br $continue)))))\n\n  (func (export \"_start\")\n    (local $i i32)\n    ($for (local.set $i (i32.const 1))\n          (i32.le_u (local.get $i) (i32.const 100))\n          (local.set $i (i32.add (local.get $i) (i32.const 1)))\n      (splice\n        ($print-if ($divisible? (local.get $i) (i32.const 3)) \"Fizz\")\n        ($print-if ($divisible? (local.get $i) (i32.const 5)) \"Buzz\")\n        ($when ($and (i32.rem_u (local.get $i) (i32.const 3))\n                     (i32.rem_u (local.get $i) (i32.const 5)))\n          (call $printnum (local.get $i)))\n        (call $print \"\\n\")))))\n",
  "gc-ast": ";; gc-ast.nacre — the § 2 node algebra of docs/wasm-macros.md, in earnest.\n;;\n;; The GC AST that the design document sketched: an abstract $node with\n;; a location field, subtypes for numbers, pairs, and nil, pattern\n;; matching by br_on_cast. The macros build GC literals at expansion\n;; time — ($qlist 1 2 3 4 5) becomes a chain of struct.new forms.\n;;\n;;   npx tsx src/nacre/cli.ts examples/gc-ast.nacre > gc.wat\n;;   wasmtime run -W gc,function-references --invoke demo gc.wat   ;; 15\n\n(module\n  (rec\n    (type $node (sub (struct (field i32))))\n    (type $num (sub final $node (struct (field i32) (field i32))))\n    (type $pair (sub final $node (struct (field i32) (field (ref $node)) (field (ref $node)))))\n    (type $nil (sub final $node (struct (field i32)))))\n  (type $t0 (func (result i32)))\n  (type $t1 (func (param (ref $node)) (result i32)))\n\n  (defmacro $qnum (n)\n    `(struct.new $num (i32.const 0) (i32.const ,n)))\n\n  (defmacro $qlist (&rest items)\n    (if (= (length items) 0)\n        `(struct.new $nil (i32.const 0))\n        `(struct.new $pair (i32.const 0)\n           ($qnum ,(first items))\n           ($qlist ,@(rest items)))))\n\n  (func $sum (type $t1) (param $n (ref $node)) (result i32)\n    (local $acc i32)\n    (local $cur (ref null $node))\n    (local $p (ref null $pair))\n    (local.set $cur (local.get $n))\n    (block $done\n      (loop $walk\n        (local.set $p\n          (block $paircase (result (ref $pair))\n            (br_on_cast $paircase (ref $node) (ref $pair)\n              (ref.as_non_null (local.get $cur)))\n            (drop)\n            (br $done)))\n        (local.set $acc\n          (i32.add (local.get $acc)\n            (struct.get $num 1 (ref.cast (ref $num) (struct.get $pair 1 (local.get $p))))))\n        (local.set $cur (struct.get $pair 2 (local.get $p)))\n        (br $walk)))\n    (local.get $acc))\n\n  (func (export \"demo\") (type $t0) (result i32)\n    (call $sum ($qlist 1 2 3 4 5)))\n\n  ;; arrays and i31: a byte array summed by index, plus a boxed scalar\n  (type $bytes (array (mut i8)))\n  (func (export \"demo2\") (type $t0) (result i32)\n    (local $a (ref null $bytes))\n    (local $i i32)\n    (local $s i32)\n    (local.set $a (array.new_fixed $bytes 3 (i32.const 7) (i32.const 8) (i32.const 9)))\n    (block $done\n      (loop $go\n        (br_if $done (i32.ge_u (local.get $i) (array.len (local.get $a))))\n        (local.set $s (i32.add (local.get $s) (array.get_u $bytes (local.get $a) (local.get $i))))\n        (local.set $i (i32.add (local.get $i) (i32.const 1)))\n        (br $go)))\n    (i32.add (local.get $s) (i31.get_s (ref.i31 (i32.const 100))))))\n",
  "clojure": ";; clj.nacre — a Clojure accent for the WebAssembly macro assembler.\n;;\n;;   npx tsx src/nacre/cli.ts src/nacre/clj.nacre your.nacre\n;;\n;; Brackets read as parentheses, so bindings look like home. Bare\n;; numbers in these macros wrap themselves in i32.const. Locals are\n;; still locals: (local.get $x) is the price of the metal. Two names\n;; are dollar-spelled on principle — a macro may not wear the name of\n;; a core form it must emit, so the value-if is $if and loop is $loop.\n;; recur is recur, and it finds the nearest $loop, as it should.\n;; All arithmetic is signed i32, which is what Clojure's ints wish\n;; they were allowed to admit.\n\n(defmacro comment (&rest ignored)\n  `(splice))\n\n;; wrap bare numbers; instructions and symbols pass through\n(defmacro num (x)\n  (if (list? x) x (if (sym? x) x `(i32.const ,x))))\n\n(defmacro $if (test then- else-)\n  `(if (result i32) (num ,test) (then (num ,then-)) (else (num ,else-))))\n\n(defmacro when (test &rest body)\n  `(if (num ,test) (then ,@body)))\n\n(defmacro when-not (test &rest body)\n  `(if (i32.eqz (num ,test)) (then ,@body)))\n\n;; flat Clojure bindings: (let [$x 1 $y (+ $x 2)] body)\n(defmacro let (bindings &rest body)\n  (if (= (length bindings) 0)\n      `(splice ,@body)\n      `(splice\n         (local ,(first bindings) i32)\n         (local.set ,(first bindings) (num ,(second bindings)))\n         (let ,(rest (rest bindings)) ,@body))))\n\n;; flat pairs with :else, value-producing\n(defmacro cond (&rest clauses)\n  (if (= (length clauses) 0)\n      `(unreachable)\n      (if (sym-is? (first clauses) \":else\")\n          `(num ,(second clauses))\n          `(if (result i32) (num ,(first clauses))\n             (then (num ,(second clauses)))\n             (else (cond ,@(rest (rest clauses))))))))\n\n(defmacro while (test &rest body)\n  `(block $break\n     (loop $continue\n       (br_if $break (i32.eqz (num ,test)))\n       ,@body\n       (br $continue))))\n\n(defmacro dotimes (binding &rest body)\n  `(splice\n     (local ,(first binding) i32)\n     (local $limit i32)\n     (local.set ,(first binding) (i32.const 0))\n     (local.set $limit (num ,(second binding)))\n     (while (i32.lt_s (local.get ,(first binding)) (local.get $limit))\n       ,@body\n       (local.set ,(first binding) (inc (local.get ,(first binding)))))))\n\n;; ($loop [$x init $y init] body) with (recur e1 e2): Clojure's loop.\n;; recur and the loop head meet at unhygienic transfer registers\n;; $recur.0, $recur.1, ... and the unhygienic label $recur-point, so\n;; nested loops nest and recur binds to the nearest one. One to three\n;; loop variables; the loop is an expression and must end in a value.\n(defmacro $loop (bindings &rest body)\n  (if (= (length bindings) 2)\n      `(splice\n         (local (unhygienic $recur.0) i32)\n         (local.set (unhygienic $recur.0) (num ,(second bindings)))\n         (loop (unhygienic $recur-point) (result i32)\n           (local ,(first bindings) i32)\n           (local.set ,(first bindings) (local.get (unhygienic $recur.0)))\n           ,@body))\n      (if (= (length bindings) 4)\n          `(splice\n             (local (unhygienic $recur.0) i32)\n             (local (unhygienic $recur.1) i32)\n             (local.set (unhygienic $recur.0) (num ,(second bindings)))\n             (local.set (unhygienic $recur.1) (num ,(second (rest (rest bindings)))))\n             (loop (unhygienic $recur-point) (result i32)\n               (local ,(first bindings) i32)\n               (local ,(first (rest (rest bindings))) i32)\n               (local.set ,(first bindings) (local.get (unhygienic $recur.0)))\n               (local.set ,(first (rest (rest bindings))) (local.get (unhygienic $recur.1)))\n               ,@body))\n          `(splice\n             (local (unhygienic $recur.0) i32)\n             (local (unhygienic $recur.1) i32)\n             (local (unhygienic $recur.2) i32)\n             (local.set (unhygienic $recur.0) (num ,(second bindings)))\n             (local.set (unhygienic $recur.1) (num ,(second (rest (rest bindings)))))\n             (local.set (unhygienic $recur.2) (num ,(second (rest (rest (rest (rest bindings)))))))\n             (loop (unhygienic $recur-point) (result i32)\n               (local ,(first bindings) i32)\n               (local ,(first (rest (rest bindings))) i32)\n               (local ,(first (rest (rest (rest (rest bindings))))) i32)\n               (local.set ,(first bindings) (local.get (unhygienic $recur.0)))\n               (local.set ,(first (rest (rest bindings))) (local.get (unhygienic $recur.1)))\n               (local.set ,(first (rest (rest (rest (rest bindings))))) (local.get (unhygienic $recur.2)))\n               ,@body)))))\n\n(defmacro recur (&rest args)\n  (if (= (length args) 1)\n      `(splice\n         (local.set (unhygienic $recur.0) (num ,(first args)))\n         (br (unhygienic $recur-point)))\n      (if (= (length args) 2)\n          `(splice\n             (local.set (unhygienic $recur.0) (num ,(first args)))\n             (local.set (unhygienic $recur.1) (num ,(second args)))\n             (br (unhygienic $recur-point)))\n          `(splice\n             (local.set (unhygienic $recur.0) (num ,(first args)))\n             (local.set (unhygienic $recur.1) (num ,(second args)))\n             (local.set (unhygienic $recur.2) (num ,(second (rest args))))\n             (br (unhygienic $recur-point))))))\n\n;; threading\n(defmacro -> (x &rest forms)\n  (if (= (length forms) 0)\n      `(num ,x)\n      (if (list? (first forms))\n          `(-> (,(first (first forms)) (num ,x) ,@(rest (first forms))) ,@(rest forms))\n          `(-> (,(first forms) (num ,x)) ,@(rest forms)))))\n\n(defmacro ->> (x &rest forms)\n  (if (= (length forms) 0)\n      `(num ,x)\n      (if (list? (first forms))\n          `(->> (,(first (first forms)) ,@(rest (first forms)) (num ,x)) ,@(rest forms))\n          `(->> (,(first forms) (num ,x)) ,@(rest forms)))))\n\n;; arithmetic, variadic and left-folded\n(defmacro + (&rest xs)\n  (if (= (length xs) 1)\n      `(num ,(first xs))\n      `(+ (i32.add (num ,(first xs)) (num ,(second xs))) ,@(rest (rest xs)))))\n\n(defmacro * (&rest xs)\n  (if (= (length xs) 1)\n      `(num ,(first xs))\n      `(* (i32.mul (num ,(first xs)) (num ,(second xs))) ,@(rest (rest xs)))))\n\n(defmacro - (&rest xs)\n  (if (= (length xs) 1)\n      `(i32.sub (i32.const 0) (num ,(first xs)))\n      (if (= (length xs) 2)\n          `(i32.sub (num ,(first xs)) (num ,(second xs)))\n          `(- (i32.sub (num ,(first xs)) (num ,(second xs))) ,@(rest (rest xs))))))\n\n(defmacro quot (a b) `(i32.div_s (num ,a) (num ,b)))\n(defmacro rem (a b) `(i32.rem_s (num ,a) (num ,b)))\n(defmacro inc (x) `(i32.add (num ,x) (i32.const 1)))\n(defmacro dec (x) `(i32.sub (num ,x) (i32.const 1)))\n\n;; predicates and comparisons, signed\n(defmacro = (a b) `(i32.eq (num ,a) (num ,b)))\n(defmacro not= (a b) `(i32.ne (num ,a) (num ,b)))\n(defmacro < (a b) `(i32.lt_s (num ,a) (num ,b)))\n(defmacro > (a b) `(i32.gt_s (num ,a) (num ,b)))\n(defmacro <= (a b) `(i32.le_s (num ,a) (num ,b)))\n(defmacro >= (a b) `(i32.ge_s (num ,a) (num ,b)))\n(defmacro zero? (x) `(i32.eqz (num ,x)))\n(defmacro pos? (x) `(i32.gt_s (num ,x) (i32.const 0)))\n(defmacro neg? (x) `(i32.lt_s (num ,x) (i32.const 0)))\n(defmacro not (x) `(i32.eqz (num ,x)))\n\n;; short-circuit, variadic\n(defmacro and (&rest xs)\n  (if (= (length xs) 1)\n      `(num ,(first xs))\n      `(if (result i32) (num ,(first xs))\n         (then (and ,@(rest xs)))\n         (else (i32.const 0)))))\n\n(defmacro or (&rest xs)\n  (if (= (length xs) 1)\n      `(num ,(first xs))\n      `(if (result i32) (num ,(first xs))\n         (then (i32.const 1))\n         (else (or ,@(rest xs))))))\n\n;; bits\n(defmacro bit-and (a b) `(i32.and (num ,a) (num ,b)))\n(defmacro bit-or (a b) `(i32.or (num ,a) (num ,b)))\n(defmacro bit-xor (a b) `(i32.xor (num ,a) (num ,b)))\n(defmacro bit-shift-left (a b) `(i32.shl (num ,a) (num ,b)))\n(defmacro bit-shift-right (a b) `(i32.shr_s (num ,a) (num ,b)))\n(defmacro unsigned-bit-shift-right (a b) `(i32.shr_u (num ,a) (num ,b)))\n\n;; collatz.nacre — the Clojure accent on bare metal.\n;;\n;;   npx tsx src/nacre/cli.ts src/nacre/clj.nacre examples/collatz.nacre > collatz.wat\n;;   wasmtime run --invoke steps collatz.wat 27        ;; 111\n;;   wasmtime run --invoke sum-squares collatz.wat     ;; 285\n\n(module\n  (comment\n    loop recur threading flat-let-bindings and arithmetic that wraps\n    its own constants. The parentheses were always here. The brackets\n    are new.)\n\n  (func (export \"steps\") (param $n i32) (result i32)\n    ($loop [$x (local.get $n) $count 0]\n      ($if (= (local.get $x) 1)\n           (local.get $count)\n           (recur ($if (zero? (rem (local.get $x) 2))\n                       (quot (local.get $x) 2)\n                       (+ (* 3 (local.get $x)) 1))\n                  (inc (local.get $count))))))\n\n  (func (export \"sum-squares\") (result i32)\n    (let [$acc 0]\n      (dotimes [$i 10]\n        (local.set $acc (+ (local.get $acc) (* (local.get $i) (local.get $i)))))\n      (local.get $acc)))\n\n  (func (export \"classify\") (param $n i32) (result i32)\n    (cond (neg? (local.get $n)) (- 0 1)\n          (zero? (local.get $n)) 0\n          :else 1))\n\n  (func (export \"thread\") (param $n i32) (result i32)\n    (-> (local.get $n)\n        (+ 1)\n        (* 2)\n        (- 3)\n        inc)))\n",

))\n(defmacro bit-shift-right (a b) `(i32.shr_s (num ,a) (num ,b)))\n(defmacro unsigned-bit-shift-right (a b) `(i32.shr_u (num ,a) (num ,b)))\n\n;; mandelzoom.nacre — a Lisp is a video source now.\n;;\n;; One hundred fifty frames of descent toward (-0.7435, 0.1314),\n;; fourteen fractional bits deep, emitted as YUV4MPEG2 — the format\n;; ffmpeg drinks straight, no flags, self-describing. Pipe and go:\n;;\n;;   npx tsx src/nacre/cli.ts src/nacre/clj.nacre examples/mandelzoom.nacre > mandelzoom.wat\n;;   wasmtime mandelzoom.wat | ffmpeg -i - mandelzoom.mp4\n;;   wasmtime mandelzoom.wat | ffmpeg -i - -f lavfi -i testsrc2=size=256x256:rate=30 \\\n;;     -filter_complex hstack -t 5 duet.mp4\n;;\n;; The same module exports frame(n)/render for hosts that would\n;; rather hold the framebuffer themselves — the browser canvas, or\n;; an ffmpeg frei0r plugin with a wasm runtime inside.\n\n(module\n  (import \"wasi_snapshot_preview1\" \"fd_write\"\n    (func $fd_write (param i32 i32 i32 i32) (result i32)))\n  (memory (export \"memory\") 16)\n\n  ;; 14-bit fixed point: 1.0 is 16384; escape at |z|^2 > 4.0 = 65536\n  (func $fmul (param $a i32) (param $b i32) (result i32)\n    (i32.shr_s (i32.mul (local.get $a) (local.get $b)) (i32.const 14)))\n\n  ;; keep z inside the range whose squares fit an i32\n  (func $clamp (param $v i32) (result i32)\n    ($if (> (local.get $v) 32767)\n         32767\n         ($if (< (local.get $v) -32768) -32768 (local.get $v))))\n\n  (func $iters (param $cx i32) (param $cy i32) (result i32)\n    (let [$zx 0 $zy 0 $i 0 $t 0]\n      (while (and (< (local.get $i) 64)\n                  (<= (+ (call $fmul (local.get $zx) (local.get $zx))\n                         (call $fmul (local.get $zy) (local.get $zy)))\n                      65536))\n        (local.set $t (call $clamp\n          (+ (- (call $fmul (local.get $zx) (local.get $zx))\n                (call $fmul (local.get $zy) (local.get $zy)))\n             (local.get $cx))))\n        (local.set $zy (cal result i32)\n    (call $frame (i32.const 100)))\n\n  ;; BT.601, integer approximation; planes at 327680, 393216, 458752\n  (func $convert\n    (let [$o 0 $p 65536 $r 0 $g 0 $b 0]\n      (while (< (local.get $o) 65536)\n        (local.set $r (i32.load8_u (local.get $p)))\n        (local.set $g (i32.load8_u (+ (local.get $p) 1)))\n        (local.set $b (i32.load8_u (+ (local.get $p) 2)))\n        (i32.store8 (+ 327680 (local.get $o))\n          (bit-shift-right (+ (+ (* 77 (local.get $r)) (* 150 (local.get $g)))\n                              (* 29 (local.get $b)))\n                           8))\n        (i32.store8 (+ 393216 (local.get $o))\n          (+ 128 (bit-shift-right (+ (- (* -43 (local.get $r)) (* 85 (local.get $g)))\n                                     (* 128 (local.get $b)))\n                                  8)))\n        (i32.store8 (+ 458752 (local.get $o))\n          (+ 128 (bit-shift-right (- (- (* 128 (local.get $r)) (* 107 (local.get $g)))\n                                     (* 21 (local.get $b)))\n                                  8)))\n        (local.set $o (inc (local.get $o)))\n        (local.set $p (+ (local.get $p) 3)))))\n\n  ;; pipes hand back short writes; loop until every byte is gone\n  (func $put (param $ptr i32) (param $len i32)\n    (while (> (local.get $len) 0)\n      (i32.store (i32.const 0) (local.get $ptr))\n      (i32.store (i32.const 4) (local.get $len))\n      (drop (call $fd_write (i32.const 1) (i32.const 0) (i32.const 1) (i32.const 8)))\n      (local.set $ptr (+ (local.get $ptr) (i32.load (i32.const 8))))\n      (local.set $len (- (local.get $len) (i32.load (i32.const 8))))))\n\n  (func (export \"_start\")\n    (let [$n 0]\n      (call $put \"YUV4MPEG2 W256 H256 F30:1 Ip A1:1 C444\\n\")\n      (while (< (local.get $n) 150)\n        (drop (call $frame (local.get $n)))\n        (call $convert)\n        (call $put \"FRAME\\n\")\n        (call $put (i32.const 327680) (i32.const 65536))\n        (call $put (i32.const 393216) (i };

const $ = (id) => document.getElementById(id);
const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
const enc = new TextEncoder(), dec = new TextDecoder();

let expandMod, asMod, nativeNs;

async function natives() {
  if (nativeNs) return nativeNs;
  nativeNs = {};
  if (C_B64) nativeNs.c = (await WebAssembly.instantiate(await WebAssembly.compile(b64(C_B64)), {})).exports;
  if (RUST_B64) nativeNs.rust = (await WebAssembly.instantiate(await WebAssembly.compile(b64(RUST_B64)), {})).exports;
  return nativeNs;
}

// instantiate with a WASI shim and the native guests; run() drives _start
async function wasiInstance(mod, stdin) {
  const outs = [];
  let pos = 0, inst;
  const dv = () => new DataView(inst.exports.memory.buffer);
  const u8 = () => new Uint8Array(inst.exports.memory.buffer);
  const imports = Object.assign({
    wasi_snapshot_preview1: {
      fd_read(fd, iovs, cnt, pn) {
        const base = dv().getUint32(iovs, true), len = dv().getUint32(iovs + 4, true);
        const n = Math.min(len, stdin.length - pos);
        u8().set(stdin.subarray(pos, pos + n), base);
        pos += n;
        dv().setUint32(pn, n, true);
        return 0;
      },
      fd_write(fd, iovs, cnt, pn) {
        const base = dv().getUint32(iovs, true), len = dv().getUint32(iovs + 4, true);
        outs.push(u8().slice(base, base + len));
        dv().setUint32(pn, len, true);
        return 0;
      },
    },
  }, await natives());
  inst = await WebAssembly.instantiate(mod, imports);
  return {
    inst,
    run() {
      inst.exports._start();
      const r = new Uint8Array(outs.reduce((a, b) => a + b.length, 0));
      let o = 0;
      for (const b of outs) { r.set(b, o); o += b.length; }
      return r;
    },
  };
}

async function run() {
  const status = $("status");
  const canvas = $("canvas");
  canvas.hidden = true;
  try {
    status.textContent = "expanding…";
    expandMod ??= await WebAssembly.compile(b64(EXPAND_B64));
    asMod ??= await WebAssembly.compile(b64(AS_B64));
    const wat = (await wasiInstance(expandMod, enc.encode($("src").value))).run();
    $("wat").textContent = dec.decode(wat);
    status.textContent = "assembling…";
    const bin = (await wasiInstance(asMod, wat)).run();
    status.textContent = "running…";
    const mod = await WebAssembly.compile(bin);
    const names = WebAssembly.Module.exports(mod).map((e) => e.name);
    if (names.includes("render") && names.includes("width")) {
      const { inst } = await wasiInstance(mod, new Uint8Array(0));
      const ptr = inst.exports.render();
      const w = inst.exports.width(), h = inst.exports.height();
      const rgb = new Uint8Array(inst.exports.memory.buffer, ptr, w * h * 3);
      canvas.width = w;
      canvas.height = h;
      canvas.hidden = false;
      const ctx = canvas.getContext("2d");
      const img = ctx.createImageData(w, h);
      for (let i = 0, j = 0; i < w * h; i++) {
        img.data[i * 4] = rgb[j++];
        img.data[i * 4 + 1] = rgb[j++];
        img.data[i * 4 + 2] = rgb[j++];
        img.data[i * 4 + 3] = 255;
      }
      ctx.putImageData(img, 0, 0);
      $("out").textContent = "rendered " + w + "×" + h + " into this tab's own canvas";
    } else if (names.includes("_start")) {
      $("out").textContent = dec.decode((await wasiInstance(mod, new Uint8Array(0))).run());
    } else {
      const { inst } = await wasiInstance(mod, new Uint8Array(0));
      const lines = [];
      for (const [name, fn] of Object.entries(inst.exports))
        if (typeof fn === "function") lines.push(name + "() = " + fn());
      $("out").textContent = lines.join("\n");
    }
    status.textContent = bin.length + " bytes of wasm, assembled right here";
  } catch (e) {
    status.textContent = "";
    $("out").textContent = String(e);
  }
}

$("example").onchange = () => {
  $("src").value = EXAMPLES[$("example").value];
  $("wat").textContent = "";
  $("out").textContent = "";
  $("canvas").hidden = true;
};
$("run").onclick = run;
$("src").value = EXAMPLES["fizzbuzz"];
</script>
</body>
